<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Złap nutę 🎹</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f6f4ff;color:#252733;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(900px,100%);margin:auto;padding:18px 14px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,36px);margin:0;font-weight:850}.score{background:#eeeaff;border-radius:999px;padding:9px 15px;font-weight:800}.instruction{text-align:center;color:#687083;font-weight:700;margin:12px 0}.game{background:#fffdf8;border:1px solid #e4dfd4;border-radius:22px;padding:8px;box-shadow:0 8px 28px rgba(40,35,70,.08)}#staff{width:100%;display:block;touch-action:none;user-select:none}.staffline{stroke:#292c34;stroke-width:2}.note ellipse{fill:#252933;stroke:#fff;stroke-width:2}.note line{stroke:#252933;stroke-width:4;stroke-linecap:round}.note text{fill:white;font-size:14px;font-weight:850;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.status{text-align:center;min-height:44px;padding:10px 4px;font-size:18px;font-weight:850}.keyboard{position:relative;height:150px;margin:4px 3px 0;display:flex;touch-action:manipulation}.white{position:relative;flex:1;background:#fff;border:1px solid #aaa;border-radius:0 0 8px 8px;min-width:0;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:800;color:#6b7280}.white:active,.white.hit{background:#ddd9ff}.black{position:absolute;top:0;height:92px;width:9%;max-width:48px;background:#20232a;border:0;border-radius:0 0 7px 7px;z-index:2;cursor:pointer;box-shadow:0 3px 4px rgba(0,0,0,.22);color:white;font-size:11px}.black:active,.black.hit{background:#5144b2}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}button{font:inherit;min-height:46px;border:0;border-radius:13px;padding:10px 16px;font-weight:800;cursor:pointer}.primary{background:#6957d8;color:white}.secondary{background:#eeeaff;color:#5041ae}.tip{text-align:center;color:#737b8b;font-size:14px;margin-top:10px}</style></head><body><main class="app"><header><h1>🎹 Złap nutę!</h1><div class="score" id="score">⭐ 0</div></header><div class="instruction">Nuta przesuwa się po pięciolinii. Kliknij jej dźwięk na klawiaturze!</div><section class="game"><svg id="staff" viewBox="0 0 760 300" aria-label="Pięciolinia z poruszającą się nutą"><rect width="760" height="300" rx="15" fill="#fffdf8"/><text x="28" y="145" font-size="94" font-family="serif" fill="#252733">𝄞</text><g id="lines"></g><g id="moving"></g></svg><div class="status" id="status">Gotowy? 🎵</div><div class="keyboard" id="keyboard"></div></section><div class="actions"><button class="primary" id="start">▶️ Start</button><button class="secondary" id="new">🎲 Nowa nuta</button></div><div class="tip">Na iPadzie wystarczy dotknąć właściwego klawisza.</div></main><script>(()=>{const svg=document.getElementById("staff"),lines=document.getElementById("lines"),moving=document.getElementById("moving"),keyboard=document.getElementById("keyboard"),status=document.getElementById("status"),scoreEl=document.getElementById("score"),start=document.getElementById("start"),newBtn=document.getElementById("new"),NS="http://www.w3.org/2000/svg";const notes=[["C4",225],["D4",213],["E4",201],["F4",189],["G4",177],["A4",165],["B4",153],["C5",141],["D5",129],["E5",117],["F5",105]],names={C4:"C",D4:"D",E4:"E",F4:"F",G4:"G",A4:"A",B4:"H",C5:"C",D5:"D",E5:"E",F5:"F"};let current=null,score=0,x=115,raf=null,running=false,last=0;function el(t,a={}){const n=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);return n}function drawStaff(){for(let i=0;i<5;i++)lines.appendChild(el("line",{x1:95,y1:153+i*12,x2:725,y2:153+i*12,class:"staffline"}))}function makeNote(){current=notes[Math.floor(Math.random()*notes.length)];x=115;moving.innerHTML="";const g=el("g",{class:"note"});g.appendChild(el("ellipse",{cx:x,cy:current[1],rx:18,ry:11}));g.appendChild(el("line",{x1:x+15,y1:current[1]-4,x2:x+15,y2:current[1]-47}));const t=el("text",{x,y});t.textContent="?";g.appendChild(t);moving.appendChild(g);status.textContent="Jaka to nuta? 🎵";running=false;last=0;start.textContent="▶️ Start"}function animate(ts){if(!running)return;if(!last)last=ts;const dt=ts-last;last=ts;x+=dt*.10;const g=moving.firstElementChild;if(g){g.querySelector("ellipse").setAttribute("cx",x);g.querySelector("line").setAttribute("x1",x+15);g.querySelector("line").setAttribute("x2",x+15);g.querySelector("text").setAttribute("x",x)}if(x>735){running=false;status.textContent="⏰ Nuta uciekła! Spróbuj jeszcze raz.";start.textContent="▶️ Start"}else raf=requestAnimationFrame(animate)}function startGame(){if(running)return;running=true;last=0;start.textContent="⏸️ Pauza";raf=requestAnimationFrame(animate)}function pause(){running=false;start.textContent="▶️ Start"}function buildKeyboard(){keyboard.innerHTML="";["C4","D4","E4","F4","G4","A4","B4","C5","D5","E5","F5"].forEach(n=>{const b=document.createElement("button");b.type="button";b.className="white";b.dataset.note=n;b.textContent=names[n];b.addEventListener("click",()=>answer(n));keyboard.appendChild(b)});[["C#4",1],["D#4",2],["F#4",4],["G#4",5],["A#4",6],["C#5",8],["D#5",9]].forEach(([n,i])=>{const b=document.createElement("button");b.type="button";b.className="black";b.dataset.note=n;b.textContent="♯";b.style.left=(i*(100/11)-4.5)+"%";keyboard.appendChild(b)})}function answer(n){if(!current)return;if(n===current[0]){score++;scoreEl.textContent="⭐ "+score;status.textContent="🎉 Brawo! To "+names[n]+"!";running=false;start.textContent="▶️ Start";const key=keyboard.querySelector('[data-note="'+n+'"]');if(key){key.classList.add("hit");setTimeout(()=>key.classList.remove("hit"),250)}setTimeout(makeNote,650)}else{status.textContent="🙂 Nie tym razem — spróbuj jeszcze raz.";const key=keyboard.querySelector('[data-note="'+n+'"]');if(key){key.classList.add("hit");setTimeout(()=>key.classList.remove("hit"),180)}}}start.addEventListener("click",()=>running?pause():startGame());newBtn.addEventListener("click",()=>{pause();makeNote()});drawStaff();buildKeyboard();makeNote()})();</script></body></html>
